<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 56" role="img" aria-label="Commerzbank Logo">
  <rect width="160" height="56" rx="6" fill="#003755"/>
  <!-- Commerzbank yellow diamond/star mark -->
  <g transform="translate(14, 8)">
    <!-- Bottom dark face -->
    <polygon points="16,38 4,22 16,28" fill="#C8960C"/>
    <!-- Left face -->
    <polygon points="4,22 16,6 16,28" fill="#F0C040"/>
    <!-- Right face -->
    <polygon points="16,6 28,22 16,28" fill="#FFD700"/>
    <!-- Top highlight -->
    <polygon points="16,6 28,22 16,28 4,22" fill="none" stroke="#FFD700" stroke-width="0.5"/>
  </g>
  <!-- COMMERZBANK text -->
  <text x="88" y="34" font-family="Arial, sans-serif" font-size="11" font-weight="700" fill="white" text-anchor="middle" letter-spacing="0.8">COMMERZBANK</text>
</svg>
