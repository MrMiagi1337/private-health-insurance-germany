<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Petrol background -->
  <circle cx="32" cy="32" r="32" fill="#1e8a9a"/>
  <!-- Compass ring -->
  <circle cx="32" cy="32" r="20" fill="none" stroke="rgba(255,255,255,0.3)" stroke-width="1.5"/>
  <!-- North needle (bright white) -->
  <polygon points="32,10 34.5,32 29.5,32" fill="white"/>
  <!-- South needle (dim) -->
  <polygon points="32,54 34.5,32 29.5,32" fill="rgba(255,255,255,0.35)"/>
  <!-- Center dot -->
  <circle cx="32" cy="32" r="3.5" fill="white"/>
</svg>
